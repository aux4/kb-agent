# KB agent model configuration.
#
# cloud: routes to the aux4 INFERENCE-BROKER (a hosted OpenAI-compatible gateway that
#        fronts Bedrock Mantle). The agent never touches Bedrock directly and needs NO
#        Bedrock IAM — it authenticates to the broker with a per-scope m2m token
#        (apiKey). The broker signs SigV4 to Mantle and meters per scope. baseURL is
#        the dev broker for now; make it env-driven (per env) before prod. [SFA]
# local: local mlx (gemma-4-e4b) for dev testing on the host. The apiKey is a poison
#        sentinel so an accidental hosted fallback fails fast instead of billing.
config:
  cloud:
    model:
      type: openai
      config:
        model: google.gemma-4-26b-a4b
        maxTokens: 1024
        temperature: 0
        apiKey: broker-managed
        configuration:
          baseURL: https://aux4.on.dev.aux4.cloud/inference-broker/api/v1
  local:
    model:
      type: openai
      config:
        model: mlx-community/gemma-4-e4b-it-bf16
        apiKey: local-only-never-bill
        maxTokens: 1024
        temperature: 0
        configuration:
          baseURL: http://localhost:8381/v1
  openai-mini:
    model:
      type: openai
      config:
        model: gpt-4o-mini
        temperature: 0
        maxTokens: 1024
